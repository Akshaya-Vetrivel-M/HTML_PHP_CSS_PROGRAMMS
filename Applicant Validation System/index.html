<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Applicant Validation System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Applicant Validation Portal</h1>
<p>Secure Application Verification System</p>
</header>
<div class="container">
<form action="validate.php" method="POST">
<h2>Applicant Details</h2>
<label>Full Name</label>
<input type="text" name="name" placeholder="Enter your name" required>
<label>Email Address</label>
<input type="email" name="email" placeholder="Enter email ID" required>
<label>Mobile Number</label>
<input type="tel" name="mobile" placeholder="Enter 10 digit mobile number" required>
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
<label>Confirm Password</label>
<input type="password" name="confirm" placeholder="Confirm password" required>
<button type="submit">Validate Application</button>
</form>
</div>
<footer>
Applicant Management System
</footer>
</body>
</html>
