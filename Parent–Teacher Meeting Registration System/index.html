<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parent Teacher Meeting Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="portal">
<div class="banner">
<h1>CampusConnect</h1>
<p>Parent Teacher Meeting Scheduler</p>
<div class="feature">
<h3>Smart Appointment Management</h3>
<p>Book your preferred meeting slot with teachers through our digital scheduling system.</p>
</div>
</div>
<div class="booking-panel">
<h2>Schedule Meeting</h2>
<p class="subtitle">Fill the details to reserve your appointment</p>
<form action="booking.php" method="post">
<div class="fields">
<div>
<label>Parent Name</label>
<input type="text" name="parent" required>
</div>
<div>
<label>Student Name</label>
<input type="text" name="student" required>
</div>
<div>
<label>Class</label>
<select name="class" required>
<option value="">Select Class</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
</select>
</div>
<div>
<label>Teacher Name</label>
<select name="teacher" required>
<option value="">Select Teacher</option>
<option>Mr. Anderson</option>
<option>Mrs. Williams</option>
<option>Mr. David</option>
<option>Mrs. Sarah</option>
</select>
</div>
<div>
<label>Meeting Date</label>
<input type="date" name="date" required>
</div>
<div>
<label>Meeting Slot</label>
<select name="slot" required>
<option value="">Choose Slot</option>
<option>09:00 AM - 09:30 AM</option>
<option>10:00 AM - 10:30 AM</option>
<option>11:00 AM - 11:30 AM</option>
<option>02:00 PM - 02:30 PM</option>
<option>03:00 PM - 03:30 PM</option>
</select>
</div>
</div>
<label>Purpose of Meeting</label>
<textarea name="purpose" required></textarea>
<button type="submit">Confirm Appointment</button>
</form>
</div>
</div>
</body>
</html>
