<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Processing System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Attendance Management System</h1>
</header>
<section class="hero">
<h2>Student Attendance Processing</h2>
<p>Check attendance percentage and examination eligibility</p>
</section>
<div class="container">
<form action="process.php" method="post">
<h2>Attendance Details</h2>
<label>Student Name</label>
<input type="text" name="name" required>
<label>Register Number</label>
<input type="text" name="regno" required>
<label>Total Working Days</label>
<input type="number" name="total" min="1" required>
<label>Days Present</label>
<input type="number" name="present" min="0" required>
<button type="submit">Process Attendance</button>
</form>
</div>
<footer>
<p>© 2026 Attendance Management System</p>
</footer>
</body>
</html>
