<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Performance Evaluation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
<h1>Performance Evaluation System</h1>
<p>Human Resource Assessment Portal</p>
</div>

<div class="main">

<div class="evaluation-card">

<h2>Employee Evaluation Form</h2>
<p class="desc">Enter employee performance scores for evaluation</p>

<form action="evaluate.php" method="post">

<label>Employee Name</label>
<input type="text" name="name" required>

<label>Employee ID</label>
<input type="text" name="id" required>

<div class="score-grid">

<div>
<label>Work Quality Score</label>
<input type="number" name="quality" min="0" max="100" required>
</div>

<div>
<label>Teamwork Score</label>
<input type="number" name="teamwork" min="0" max="100" required>
</div>

<div>
<label>Punctuality Score</label>
<input type="number" name="punctuality" min="0" max="100" required>
</div>

<div>
<label>Skill Score</label>
<input type="number" name="skill" min="0" max="100" required>
</div>

</div>

<button type="submit">Generate Evaluation</button>

</form>

</div>

</div>

</body>
</html>
