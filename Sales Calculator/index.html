<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sales Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Sales Calculator System</h1>
<p>Product Sales Management Portal</p>
</header>

<div class="container">

<form action="calculate.php" method="POST">

<h2>Product Details</h2>

<label>Product Name</label>
<input type="text" name="product" placeholder="Enter product name" required>

<label>Quantity</label>
<input type="number" name="quantity" min="1" placeholder="Enter quantity" required>

<label>Price Per Item</label>
<input type="number" name="price" min="0" step="0.01" placeholder="Enter product price" required>

<button type="submit">Calculate Sales</button>

</form>

</div>

<footer>
Sales Management System
</footer>

</body>
</html>
